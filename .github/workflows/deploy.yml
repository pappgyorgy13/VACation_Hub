name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Create custom 404.html
        run: |
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CS2 Ban Tracker</title><style>body{background:#0a0a0a;color:white;font-family:system-ui,sans-serif;height:100vh;margin:0;display:flex;align-items:center;justify-content:center;text-align:center}h1{color:#f97316}</style></head><body><h1>CS2 Ban Tracker</h1><p>Redirecting...</p><script>var p=location.pathname,q=location.search,b="/VACation_Hub";if(p.endsWith("/player")||p==="/player")location.href=b+"/player/index.html"+(q||"");else if(p.indexOf(b)===-1)location.href=b+p+"/index.html"+q;else location.href=p+"/index.html"+q</script></body></html>' > out/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4