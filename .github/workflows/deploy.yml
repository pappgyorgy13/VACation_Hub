name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Copy custom 404.html
        run: |
          cat > out/404.html << '404EOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS2 Ban Tracker - Redirecting</title>
  <style>
    body { background: #0a0a0a; color: white; font-family: system-ui, sans-serif; height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
    h1 { color: #f97316; margin: 0; }
    p { color: #9ca3af; margin-top: 1rem; }
  </style>
</head>
<body>
  <div>
    <h1>CS2 Ban Tracker</h1>
    <p>Redirecting to player page...</p>
  </div>
  <script>
    (function() {
      var path = location.pathname;
      var search = location.search;
      var base = '/VACation_Hub';

      if (path.endsWith('/player') || path === '/player') {
        var target = base + '/player/index.html';
        location.href = target + (search || '');
      } else if (path.indexOf(base) === -1) {
        var cleanPath = path.replace(/^\//, '');
        if (cleanPath) {
          location.href = base + '/' + cleanPath + '/index.html' + search;
        } else {
          location.href = base + '/index.html';
        }
      } else {
        var remaining = path.substring(base.length);
        if (remaining && !remaining.endsWith('/')) remaining += '/';
        location.href = path + remaining + 'index.html' + search;
      }
    })();
  </script>
</body>
</html>
404EOF
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4